# =============================================================================
#  config/verify.yaml —— 误差检验与评估配置
# =============================================================================

variables: [t2, u10, v10, ps, t500, z500]
thresholds: [0.1, 1.0, 5.0, 10.0]
methods: [bias, rmse, mae, correlation, acc, ets, fss, brier, crps]
neighborhood_radii: [1, 3, 5, 9]
matchup: nearest            # nearest | bilinear | trilinear
temporal_tolerance: 1800    # 观测与预报的最大时间差 (s)
climatology: ""             # 气候态文件（用于 ACC）
compute_ensemble_scores: false
output_format: csv          # csv | json | netcdf
